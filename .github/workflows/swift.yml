name: Swift package
on:
  push:
    branches: ['**']
    paths: ['Package.swift', 'icons/Sources/**', 'icons/tests/IconsTests/**', 'vectors/Sources/**', 'vectors/tests/VectorsTests/**', 'sounds/Sources/**', 'sounds/tests/SoundsTests/**', 'components/Sources/**', 'components/tests/ComponentsTests/**', 'components/recipes/**', '.github/workflows/swift.yml']
  pull_request:
    paths: ['Package.swift', 'icons/Sources/**', 'icons/tests/IconsTests/**', 'vectors/Sources/**', 'vectors/tests/VectorsTests/**', 'sounds/Sources/**', 'sounds/tests/SoundsTests/**', 'components/Sources/**', 'components/tests/ComponentsTests/**', 'components/recipes/**', '.github/workflows/swift.yml']
permissions:
  contents: read
concurrency:
  group: swift-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: macos-15
    strategy:
      matrix:
        scheme: [Icons, Vectors, Sounds, Components]
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -scheme hugocxlStack-Package -destination 'platform=macOS' -derivedDataPath /tmp/macos -only-testing:${{ matrix.scheme }}Tests test
      - run: xcodebuild -scheme ${{ matrix.scheme }} -destination 'generic/platform=iOS Simulator' -derivedDataPath /tmp/ios CODE_SIGNING_ALLOWED=NO build
  # Swift Package Manager resolves plain semver tags, so the hugocxlStack package gets its own
  # unprefixed series. The run number is stable across retries and unique across pushes.
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag the Swift package
        env:
          TAG: 0.1.${{ github.run_number }}
        run: |
          if git rev-parse --verify "refs/tags/$TAG" >/dev/null 2>&1; then
            test "$(git rev-parse "$TAG^{commit}")" = "$GITHUB_SHA"
          else
            git -c tag.gpgSign=false tag "$TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG"
          fi
