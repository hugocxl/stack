name: Validate
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [reference]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Package release
        id: package
        run: node scripts/prepare-release.mjs
      - name: Publish and verify npm package
        run: node scripts/publish-npm.mjs
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.package.outputs.tag }}
        run: bash scripts/publish-release.sh
      - name: Rebuild the sites that use the design system
        env:
          GH_TOKEN: ${{ secrets.STACK_DEPLOY_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::STACK_DEPLOY_TOKEN is not set, so the sites were not rebuilt."
            exit 0
          fi
          for repo in icons vectors tab quickshot agentkit; do
            gh workflow run pages.yml --repo "hugocxl/$repo" --ref main
            echo "Started the hugocxl/$repo site deploy."
          done
