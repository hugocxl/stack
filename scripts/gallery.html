<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="{{figure_count}} static isometric SVG illustrations for websites and product pages.">
<title>P9 Figures</title>
<style>
  :root { color-scheme: dark; --bg: #0b0c0e; --plate: #101215; --ink: #edf0f5; --soft: #a1a9b6; --border: #2a2e35; --hover: #414957; --art-brightness: 1.23; }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme]) { color-scheme: light; --bg: #fafafa; --plate: #f2f3f5; --ink: #171a21; --soft: #515b69; --border: #dfe2e7; --hover: #b2bac6; --art-brightness: .76; }
  }
  :root[data-theme="light"] { color-scheme: light; --bg: #fafafa; --plate: #f2f3f5; --ink: #171a21; --soft: #515b69; --border: #dfe2e7; --hover: #b2bac6; --art-brightness: .76; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 "Inter", system-ui, sans-serif; }
  a { color: inherit; text-decoration: none; }
  a:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid currentColor; outline-offset: 4px; }
  .shell { max-width: 1312px; margin: auto; padding-inline: clamp(18px, 5vw, 72px); }
  header { border-bottom: 1px solid var(--border); }
  .top { min-height: 66px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .brand { font-weight: 650; letter-spacing: -.035em; }
  .tools { display: flex; gap: 16px; align-items: center; color: var(--soft); font-size: 13px; }
  button, input { color: inherit; font: inherit; background: var(--plate); border: 1px solid var(--border); border-radius: 7px; }
  button { padding: 6px 11px; cursor: pointer; }
  .intro { padding-block: clamp(55px, 8vw, 120px) clamp(30px, 5vw, 60px); }
  h1 { font-size: clamp(52px, 9vw, 116px); line-height: 1; letter-spacing: -.047em; font-weight: 650; margin: 0 0 20px; }
  .intro p { font-size: clamp(16px, 2vw, 20px); color: var(--soft); margin: 0; }
  .filters { padding-block: 15px; border-block: 1px solid var(--border); display: flex; gap: 12px 24px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
  nav { display: flex; gap: 8px 22px; flex-wrap: wrap; color: var(--soft); font-size: 14px; }
  nav a:hover, .tools a:hover, h3 a:hover { text-decoration: underline; text-underline-offset: 4px; }
  input { padding: 7px 11px; width: min(100%, 240px); }
  section { padding-block: 26px 12px; scroll-margin: 20px; }
  h2 { font-size: 25px; line-height: 1.2; letter-spacing: -.03em; margin: 16px 0 20px; }
  .cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 17px; list-style: none; margin: 0; padding: 0; }
  .card { border: 1px solid var(--border); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; }
  .card:hover, button:hover, .download:hover { border-color: var(--hover); }
  .art { display: block; background: var(--plate); border-bottom: 1px solid var(--border); }
  .art:focus-visible { outline-offset: -4px; }
  .art img { display: block; width: 100%; height: auto; filter: brightness(var(--art-brightness)); }
  .card-info { padding: 15px 16px 16px; display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  h3 { font-size: 15px; margin: 0 0 3px; line-height: 1.3; }
  .card p { color: var(--soft); font-size: 13px; margin: 0; }
  .download { width: 32px; height: 32px; flex: 0 0 32px; display: grid; place-items: center; border: 1px solid var(--border); border-radius: 6px; font-size: 19px; line-height: 1; color: var(--soft); }
  footer { margin-top: 52px; border-top: 1px solid var(--border); color: var(--soft); padding-block: 25px; font-size: 13px; }
  footer a { text-decoration: underline; text-underline-offset: 4px; }
  @media(max-width: 820px) { .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media(max-width: 500px) { .cards { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header><div class="shell top">
  <a href="./" class="brand">P9 Figures</a>
  <div class="tools"><a href="use-cases.html">Use cases</a><button id="theme" type="button" hidden></button><a href="https://github.com/hugocxl/p9-figures">GitHub ↗</a></div>
</div></header>
<main class="shell">
  <div class="intro"><h1>P9 Figures</h1><p>{{figure_count}} isometric SVG illustrations for websites and product pages.</p></div>
  <div class="filters"><nav aria-label="Collections"><!-- CATEGORIES --></nav>
  <input id="search" type="search" aria-label="Find a figure" placeholder="Find a figure…" hidden></div>
  <p id="empty" role="status" hidden>No matching figures.</p>
  <!-- COLLECTIONS -->
</main>
<footer><div class="shell">MIT licensed. Inspired by <a href="https://hairline.lucasmarkes.com/skills">Hairline by Lucas Marques</a>.</div></footer>
<script>
  const search = document.querySelector("#search");
  const theme = document.querySelector("#theme");
  const sections = [...document.querySelectorAll("main section")];
  const empty = document.querySelector("#empty");
  const system = matchMedia("(prefers-color-scheme: dark)");
  const root = document.documentElement;

  const currentTheme = () => root.dataset.theme || (system.matches ? "dark" : "light");
  function labelTheme() {
    theme.textContent = currentTheme() === "dark" ? "Light mode" : "Dark mode";
  }
  theme.addEventListener("click", () => {
    root.dataset.theme = currentTheme() === "dark" ? "light" : "dark";
    labelTheme();
  });
  system.addEventListener("change", labelTheme);
  labelTheme();
  theme.hidden = false;

  search.addEventListener("input", () => {
    const terms = search.value.trim().toLowerCase().split(/\s+/);
    for (const section of sections) {
      const cards = [...section.querySelectorAll("[data-figure]")];
      for (const card of cards) {
        const text = card.textContent.toLowerCase();
        card.hidden = !terms.every(term => text.includes(term));
      }
      section.hidden = cards.every(card => card.hidden);
    }
    empty.hidden = sections.some(section => !section.hidden);
  });
  search.hidden = false;
</script>
</body>
</html>
