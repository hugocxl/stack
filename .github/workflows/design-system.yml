name: Design system
on:
  push:
    branches: ['**']
    paths: ['design-system/**', '.github/workflows/design-system.yml', 'pnpm-workspace.yaml']
  pull_request:
    paths: ['design-system/**', '.github/workflows/design-system.yml', 'pnpm-workspace.yaml']
permissions:
  contents: read
concurrency:
  group: design-system-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults:
  run:
    working-directory: design-system
jobs:
  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [reference]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Package release
        id: package
        run: node scripts/prepare-release.mjs
      - name: Publish and verify npm package
        run: node scripts/publish-npm.mjs
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.package.outputs.tag }}
        run: bash scripts/publish-release.sh
      - name: Rebuild the stack website
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "${{ github.repository }}" --ref main
      - name: Rebuild the sites that use the design system
        env:
          GH_TOKEN: ${{ secrets.STACK_DEPLOY_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::STACK_DEPLOY_TOKEN is not set, so the sites were not rebuilt."
            exit 0
          fi
          for repo in tab quickshot agentkit; do
            gh workflow run pages.yml --repo "hugocxl/$repo" --ref main
            echo "Started the hugocxl/$repo site deploy."
          done
