<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Browse concrete use cases for isometric website illustrations.">
<title>Use cases · P9 Figures</title>
<style>
  :root { color-scheme: dark; --bg: #0b0c0e; --plate: #13151a; --ink: #edf0f5; --muted: #a6afbc; --rule: #2d323a; }
  @media (prefers-color-scheme: light) {
    :root { color-scheme: light; --bg: #fafafa; --plate: #f1f3f5; --ink: #171a21; --muted: #525c6b; --rule: #dce0e6; }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.6 "Inter", system-ui, sans-serif; }
  header { border-bottom: 1px solid var(--rule); }
  .shell { max-width: 1088px; margin: auto; padding-inline: clamp(18px, 5vw, 64px); }
  header .shell { min-height: 64px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  a { color: inherit; text-underline-offset: 4px; }
  header a { text-decoration: none; font-size: 14px; }
  header a:first-child { font-weight: 650; }
  .intro { padding-block: clamp(38px, 7vw, 82px) 28px; }
  h1 { margin: 0 0 12px; font-size: clamp(44px, 7vw, 84px); line-height: 1.05; letter-spacing: -.05em; }
  p { margin: 0; color: var(--muted); }
  .controls { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; padding: 15px 0; border-block: 1px solid var(--rule); }
  input, select { font: inherit; border: 1px solid var(--rule); border-radius: 6px; padding: 7px 10px; background: var(--plate); color: var(--ink); }
  #filter { width: min(100%, 340px); }
  #result-count { margin-left: auto; font-size: 13px; }
  main { padding-bottom: 42px; }
  h2 { margin: 33px 0 10px; font-size: 21px; letter-spacing: -.02em; }
  ul { margin: 0; padding: 0; list-style: none; }
  li { padding: 12px 0; border-top: 1px solid var(--rule); display: flex; gap: 16px; align-items: start; justify-content: space-between; }
  li > a, li > span { white-space: nowrap; font-size: 13px; }
  li > span { color: var(--muted); }
  h3 { margin: 0 0 1px; font-size: 15px; font-weight: 650; }
  li p { font-size: 14px; }
  a:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid currentColor; outline-offset: 3px; }
  #empty { padding-block: 22px; }
  @media(max-width: 575px) { .controls { gap: 8px; } #result-count { margin-left: 0; } }
</style>
</head>
<body>
<header><nav class="shell" aria-label="Site"><a href="./">P9 Figures</a><a href="https://github.com/hugocxl/p9-figures">GitHub ↗</a></nav></header>
<main class="shell">
  <div class="intro"><h1>Use-case catalog</h1><p>{{case_count}} website illustration briefs, with {{figure_count}} finished SVGs available.</p></div>
  <div class="controls" hidden>
    <input id="filter" type="search" placeholder="Find a use case…" aria-label="Find a use case">
    <select id="availability" aria-label="Availability"><option value="">All cases</option><option value="1">SVG available</option><option value="0">Planned</option></select>
    <p id="result-count" aria-live="polite"></p>
  </div>
  <p id="empty" hidden>No matching use cases.</p>
  <!-- GROUPS -->
</main>
<script>
  const search = document.querySelector("#filter");
  const availability = document.querySelector("#availability");
  const result = document.querySelector("#result-count");
  const empty = document.querySelector("#empty");
  const sections = [...document.querySelectorAll("main section")].map(section => ({
    section,
    items: [...section.querySelectorAll("li")].map(node => ({
      node,
      text: node.firstElementChild.textContent.toLowerCase()
    }))
  }));
  function update() {
    const terms = search.value.trim().toLowerCase().split(/\s+/);
    let count = 0;
    for (const {section, items} of sections) {
      let sectionCount = 0;
      for (const {node, text} of items) {
        const shown = terms.every(term => text.includes(term))
          && (!availability.value || node.dataset.asset === availability.value);
        node.hidden = !shown;
        sectionCount += Number(shown);
      }
      section.hidden = sectionCount === 0;
      count += sectionCount;
    }
    result.textContent = new Intl.NumberFormat().format(count) + " " + (count === 1 ? "case" : "cases");
    empty.hidden = count > 0;
  }
  search.addEventListener("input", update);
  availability.addEventListener("change", update);
  update();
  document.querySelector(".controls").hidden = false;
</script>
</body>
</html>
