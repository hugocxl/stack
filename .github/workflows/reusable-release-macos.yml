name: Reusable macOS Release

on:
  workflow_call:
    inputs:
      app-name:
        type: string
        required: true
      artifact-paths:
        type: string
        required: true
      deployment-target:
        type: string
        default: ''
      enable-beta:
        type: boolean
        default: false
      require-update-key:
        type: boolean
        default: false
      checkout-subdir:
        type: string
        default: ''
      setup-command:
        type: string
        default: ''
      xcode-path:
        type: string
        default: /Applications/Xcode_27.1.app
      runs-on:
        type: string
        default: xcode-27
      timeout-minutes:
        type: number
        default: 90

permissions:
  contents: read

jobs:
  release:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    defaults:
      run:
        working-directory: ${{ inputs.checkout-subdir != '' && inputs.checkout-subdir || '.' }}
    permissions:
      contents: write
    env:
      MACOSX_DEPLOYMENT_TARGET: ${{ inputs.deployment-target }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          path: ${{ inputs.checkout-subdir }}
      - name: Lint commit messages
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ ! -f scripts/commit-lint.py ] || [ "$GITHUB_REF_TYPE" != branch ]; then exit 0; fi
          if [ -n "$BEFORE" ] && [[ ! "$BEFORE" =~ ^0+$ ]] && git merge-base --is-ancestor "$BEFORE" "$GITHUB_SHA" 2>/dev/null; then
            python3 scripts/commit-lint.py --range "$BEFORE..$GITHUB_SHA"
          else
            python3 scripts/commit-lint.py --range "$GITHUB_SHA^!"
          fi
      - name: Version the pushed commits
        env:
          BEFORE: ${{ github.event.before }}
          APP_NAME: ${{ inputs.app-name }}
          ENABLE_BETA: ${{ inputs.enable-beta }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = branch ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898283+github-actions[bot]@users.noreply.github.com'
            scripts/changelog.sh tag "$BEFORE" "$GITHUB_SHA"
            VERSION="$(scripts/changelog.sh version)"
            {
              echo "RELEASE_TAG=v$VERSION"
              echo "RELEASE_VERSION=$VERSION"
              echo "RELEASE_CHANNEL=stable"
            } >> "$GITHUB_ENV"
            exit 0
          fi
          if [ "$ENABLE_BETA" != true ]; then
            echo 'Error: beta releases are not enabled for this repository' >&2
            exit 1
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-beta\.([1-9][0-9]*)$ ]]; then
            echo 'Error: beta tags must be vX.Y.Z-beta.N' >&2
            exit 1
          fi
          COUNT="$(git rev-list --count HEAD)"
          if [ "${BASH_REMATCH[1]}" != "$COUNT" ]; then
            echo "Error: a beta tag ends in its commit's count; tag this commit v${VERSION%-beta.*}-beta.$COUNT" >&2
            exit 1
          fi
          git fetch origin '+refs/heads/main:refs/remotes/origin/main'
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo 'Error: release only commits on main' >&2
            exit 1
          fi
          {
            echo "RELEASE_TAG=$GITHUB_REF_NAME"
            echo "RELEASE_VERSION=$VERSION"
            echo "RELEASE_CHANNEL=beta"
          } >> "$GITHUB_ENV"
      - name: Select Xcode
        run: |
          set -euo pipefail
          sudo xcode-select -s "${{ inputs.xcode-path }}"
          xcodebuild -version
          swift --version
      - name: Setup
        if: inputs.setup-command != ''
        run: ${{ inputs.setup-command }}
      - name: Validate
        run: scripts/validate.sh
      - name: Push version tags
        if: env.RELEASE_CHANNEL == 'stable'
        run: |
          set -euo pipefail
          git push origin "refs/tags/$RELEASE_TAG" || true
          REMOTE_TAGS="$(git ls-remote --tags --refs origin | sed 's#.*refs/tags/##' | sort)"
          for OLDER in $(comm -23 <(git tag --list 'v*' | sort) <(printf '%s\n' "$REMOTE_TAGS")); do
            git push origin "refs/tags/$OLDER" || echo "::warning::GitHub refused tag $OLDER"
          done
      - name: Import Developer ID certificate
        env:
          CERTIFICATE_P12: ${{ secrets.DEVELOPER_ID_APPLICATION_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_PASSWORD }}
        run: |
          set -euo pipefail
          : "${CERTIFICATE_P12:?Developer ID certificate is required}"
          : "${CERTIFICATE_PASSWORD:?Certificate password is required}"
          umask 077
          CERTIFICATE="$RUNNER_TEMP/release-certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/release-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          trap 'rm -f "$CERTIFICATE"' EXIT
          printf '%s' "$CERTIFICATE_P12" | base64 --decode > "$CERTIFICATE"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" "$HOME/Library/Keychains/login.keychain-db"
          security import "$CERTIFICATE" -k "$KEYCHAIN_PATH" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk '/Developer ID Application:/ {print $2; exit}')"
          : "${IDENTITY:?No Developer ID Application identity found}"
          echo "CODESIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
      - name: Build, sign, notarize, staple and verify release
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          REQUIRE_NOTARIZATION: '1'
        run: |
          set -euo pipefail
          umask 077
          if [ "${{ inputs.require-update-key }}" = true ]; then
            : "${UPDATE_SIGNING_KEY:?UPDATE_SIGNING_KEY is required}"
          fi
          if [ -n "$APPLE_API_KEY_P8" ]; then
            export APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
            printf '%s' "$APPLE_API_KEY_P8" | base64 --decode > "$APPLE_API_KEY_PATH"
            unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD
          fi
          scripts/release.sh
          rm -f "$RUNNER_TEMP/AuthKey.p8"
      - name: Publish complete assets through a draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_NAME: ${{ inputs.app-name }}
          ARTIFACT_PATTERNS: ${{ inputs.artifact-paths }}
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"
          PREVIOUS="$(gh release view --json tagName --jq .tagName 2>/dev/null || true)"
          scripts/changelog.sh notes "${PREVIOUS#v}" > "$RUNNER_TEMP/release-notes.md"
          if gh release view "$TAG" --json isDraft > "$RUNNER_TEMP/release.json"; then
            if [ "$(plutil -extract isDraft raw "$RUNNER_TEMP/release.json")" != true ]; then
              echo 'Error: this release is already public; its assets are immutable' >&2
              exit 1
            fi
          else
            PRERELEASE=--prerelease=false
            if [ "$RELEASE_CHANNEL" = beta ]; then PRERELEASE=--prerelease; fi
            gh release create "$TAG" --verify-tag --draft --latest=false "$PRERELEASE" \
              --title "$APP_NAME $RELEASE_VERSION" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          ASSETS=()
          while IFS= read -r pattern; do
            [ -n "$pattern" ] || continue
            expanded="${pattern//\$\{RELEASE_VERSION\}/$RELEASE_VERSION}"
            for match in $expanded; do
              [ -f "$match" ] && ASSETS+=("$match")
            done
          done <<< "$ARTIFACT_PATTERNS"
          [ "${#ASSETS[@]}" -gt 0 ] || { echo 'Error: no release assets matched' >&2; exit 1; }
          gh release upload "$TAG" --clobber "${ASSETS[@]}"
          for ASSET in "${ASSETS[@]}"; do
            NAME="$(basename "$ASSET")"
            REMOTE_SIZE="$(gh release view "$TAG" --json assets --jq ".assets[] | select(.name == \"$NAME\") | .size")"
            test "$REMOTE_SIZE" = "$(stat -f %z "$ASSET")"
          done
          if [ "$RELEASE_CHANNEL" = beta ]; then
            gh release edit "$TAG" --draft=false --prerelease --latest=false
            exit 0
          fi
          LATEST="$(gh release view --json tagName --jq .tagName 2>/dev/null || true)"
          NEWEST="$(printf '%s\n%s\n' "${LATEST#v}" "$RELEASE_VERSION" | sed '/^$/d' | sort -t. -k1,1n -k2,2n -k3,3n | tail -1)"
          if [ "$NEWEST" = "$RELEASE_VERSION" ]; then LATEST_FLAG=--latest; else LATEST_FLAG=--latest=false; fi
          gh release edit "$TAG" --draft=false --prerelease=false "$LATEST_FLAG"
      - name: Move the beta feed
        if: env.RELEASE_CHANNEL == 'beta'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_NAME: ${{ inputs.app-name }}
        run: |
          set -euo pipefail
          if ! gh release view beta > /dev/null 2>&1; then
            gh release create beta --prerelease --latest=false --target "$GITHUB_SHA" --title "$APP_NAME Beta feed" \
              --notes "The update feed of $APP_NAME betas. Each beta is published as its own vX.Y.Z-beta.N release."
          fi
          CURRENT=0
          if gh release download beta --pattern update.json --dir "$RUNNER_TEMP/beta-feed" 2> /dev/null; then
            CURRENT="$(plutil -extract version raw "$RUNNER_TEMP/beta-feed/update.json" | sed -n 's/.*-beta\.\([0-9]*\)$/\1/p')"
          fi
          if [ "${RELEASE_VERSION##*-beta.}" -le "${CURRENT:-0}" ]; then
            echo "The beta feed already names a newer beta (build $CURRENT)"
            exit 0
          fi
          gh release upload beta --clobber build/release/update.json
      - name: Preserve validation logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: validation-logs
          path: ${{ inputs.checkout-subdir != '' && format('{0}/build/validation/*.log', inputs.checkout-subdir) || 'build/validation/*.log' }}
          if-no-files-found: ignore
      - name: Remove signing keychain
        if: always()
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/release-signing.keychain-db"
          if [ -f "$KEYCHAIN_PATH" ]; then security delete-keychain "$KEYCHAIN_PATH"; fi
          rm -f "$RUNNER_TEMP/release-certificate.p12" "$RUNNER_TEMP/AuthKey.p8"
