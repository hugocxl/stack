name: Deploy website
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sounds-version:
        description: Version of @hugocxl/sounds to show on the website. Defaults to the latest on npm.
        required: false
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Each section shows the newest published design system and icons, as the separate sites did.
      - run: pnpm --filter icons-workspace --filter vectors-workspace --filter sounds-workspace update --latest @hugocxl/design-system
      - run: pnpm --filter vectors-workspace update --latest @hugocxl/icons
      - name: Build the website
        env:
          SITE_VERSION: ${{ inputs.sounds-version }}
        run: |
          if [ -z "$SITE_VERSION" ]; then SITE_VERSION=$(npm view @hugocxl/sounds version 2>/dev/null || true); fi
          export SITE_VERSION
          pnpm build:site
      - run: pnpm check:site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
