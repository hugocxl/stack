packages:
  - ai
  - design-system
  - icons
  - icons/packages/*
  - vectors
  - vectors/packages/*
  - sounds
  - sounds/packages/*
minimumReleaseAgeExclude:
  - '@hugocxl/design-system@0.2.10'
  - '@hugocxl/icons@0.2.0 || 0.2.29'
  - '@hugocxl/sounds@0.1.3'
  - '@hugocxl/vectors@0.1.0 || 0.1.11'

allowBuilds:
  esbuild: true

# Our own packages must install the moment they are released, as they did under npm.
minimumReleaseAgeExclude:
  - '@hugocxl/*'
