name: Sounds
on:
  push:
    branches: ['**']
    paths: ['sounds/**', '.github/workflows/sounds.yml', 'pnpm-workspace.yaml']
  pull_request:
    paths: ['sounds/**', '.github/workflows/sounds.yml', 'pnpm-workspace.yaml']
permissions:
  contents: read
concurrency:
  group: sounds-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults:
  run:
    working-directory: sounds
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test
      - run: node scripts/build-site.mjs
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Package release
        id: package
        run: node scripts/prepare-release.mjs
      - name: Publish and verify the npm package
        run: node scripts/publish-npm.mjs
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.package.outputs.tag }}
        run: bash scripts/publish-release.sh
      - name: Deploy the website with the new version
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "${{ github.repository }}" --ref main -f sounds-version=${{ steps.package.outputs.version }}
